
name: STAR BAGS Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'STAR_BAGS_Android_Project_WhatsApp_Fix_v2_Stage2.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build STAR BAGS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q STAR_BAGS_Android_Project_WhatsApp_Fix_v2_Stage2.zip -d project
          echo "Project extracted successfully"
          find project -name gradlew -type f

      - name: Build APK
        run: |
          cd project/STAR_BAGS_Android_Project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-BAGS-APK
          path: project/STAR_BAGS_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
