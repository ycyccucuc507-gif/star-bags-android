name: STAR BAGS Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'STAR_BAGS_Android_Project_WhatsApp_Fix_v1.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build STAR BAGS APK
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle
        run: gradle --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Check project ZIP
        run: |
          if [ ! -f STAR_BAGS_Android_Project_WhatsApp_Fix_v1.zip ]; then
            echo "ERROR: STAR_BAGS_Android_Project_WhatsApp_Fix_v1.zip not found in repository root."
            exit 1
          fi

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -oq STAR_BAGS_Android_Project_WhatsApp_Fix_v1.zip -d project
          SETTINGS_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings.gradle not found in ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-BAGS-Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
