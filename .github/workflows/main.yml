
name: STAR BAGS Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'STAR_BAGS_Android_Project_WhatsApp_Fix_v1.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build STAR BAGS APK
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q STAR_BAGS_Android_Project_WhatsApp_Fix_v1.zip -d project
          echo "Project extracted"

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
  uses: gradle/actions/setup-gradle@v4
  with:
    gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-BAGS-Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

