
name: STAR BAGS Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'STAR_BAGS_Android_Project_WhatsApp_Fix_v2_Stage2.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build STAR BAGS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q STAR_BAGS_Android_Project_WhatsApp_Fix_v2_Stage2.zip -d project
          echo "Project extracted"

      - name: Find Android project
        run: |
          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found in ZIP."
            echo "ZIP file contents:"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-BAGS-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
