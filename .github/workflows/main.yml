
name: STAR BAGS Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'STAR_BAGS_Android_Project_WhatsApp_Fix_v2_Stage2.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build STAR BAGS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q STAR_BAGS_Android_Project_WhatsApp_Fix_v2_Stage2.zip -d project
          echo "Extracted project files:"
          find project -maxdepth 5 -name gradlew -o -name settings.gradle -o -name settings.gradle.kts

      - name: Locate Gradle wrapper
        run: |
          WRAPPER="$(find project -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project found at: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-BAGS-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
